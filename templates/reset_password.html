{% extends "base.html" %}
{% block title %} — Reset Password{% endblock %}
{% block extra_head %}
<style>
.reset-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px; background:var(--bg) }
.reset-card { width:100%; max-width:460px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px }
.step { display:none }
.step.show { display:block }
</style>
{% endblock %}
{% block body %}
<div class="reset-wrap">
  <div class="reset-card slide-up">
    <div style="margin-bottom:18px">
      <div style="font-size:28px;font-weight:900;margin-bottom:6px">Reset Password</div>
      <div style="font-size:14px;color:var(--muted)">No OTP needed. Verify your account and set a new password.</div>
    </div>

    <div id="resetAlert" class="alert" style="display:none;margin-bottom:14px"></div>

    <div id="step-verify" class="step show">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="form-group">
          <label class="form-label">Registered Email</label>
          <input class="form-input" id="reset_email" type="email" placeholder="owner@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" id="reset_username" placeholder="Enter username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <button class="btn btn-primary btn-full" id="verifyIdentityBtn">Continue</button>
      </div>
    </div>

    <div id="step-password" class="step">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-input" id="new_password" type="password" autocomplete="new-password" placeholder="Enter new password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input class="form-input" id="confirm_password" type="password" autocomplete="new-password" placeholder="Re-enter new password">
        </div>
        <button class="btn btn-primary btn-full" id="savePasswordBtn">Save New Password</button>
      </div>
    </div>

    <div style="margin-top:16px;text-align:center">
      <a href="{{ url_for('login') }}" style="font-size:13px;color:var(--muted);text-decoration:none">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/reset_password.js') }}"></script>
{% endblock %}
