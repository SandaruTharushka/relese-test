<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Receipt — {{ sale.invoice_number }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:      #1a1a1a;
      --muted:    #8B7D6B;
      --bg:       #FEFCF8;
      --line:     #C8C0B0;
      --page-bg:  #EDE9E0;
    }

    @page {
      size: {{ paper_width or '80mm' }} auto;
      margin: 0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--ink);
      font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    }

    /* Screen widths: 58mm≈160px  80mm≈224px  A4≈595px */
    .wrap {
      {% if compact_mode or paper_width == '58mm' %}
      width: 160px;
      {% elif print_mode == 'a4' or paper_width == 'A4' %}
      width: 595px;
      {% else %}
      width: 224px;
      {% endif %}
      margin: 12px auto;
    }

    /* ── Receipt shell ─────────────────────────────────────────── */
    .receipt {
      background: var(--bg);
      font-size: 11px;
      line-height: 1.4;
      border-top: 4px solid var(--ink);
      padding: 10px 10px 0;
    }

    /* Perforated tear edge */
    .receipt-tear {
      height: 14px;
      margin-top: 8px;
      background-image: radial-gradient(circle at 50% 0%, var(--page-bg) 7px, var(--bg) 7px);
      background-size: 14px 14px;
      background-repeat: repeat-x;
      background-position: 0 0;
    }

    /* ── Separators ────────────────────────────────────────────── */
    .sep, .line {
      border: none;
      border-top: 1px dashed var(--line);
      margin: 7px 0;
    }
    .sep-solid {
      border: none;
      border-top: 2px solid var(--ink);
      margin: 7px 0 5px;
    }

    /* ── Utilities ─────────────────────────────────────────────── */
    .center { text-align: center; }
    .muted  { color: var(--muted); }
    .mono   { font-family: 'DM Mono', 'Courier New', monospace; }
    .row    { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin: 2px 0; }
    .value  { text-align: right; white-space: nowrap; font-family: 'DM Mono', 'Courier New', monospace; }

    /* ── Header ────────────────────────────────────────────────── */
    .store-header { text-align: center; padding: 8px 0 4px; }
    .store-name {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }
    .store-tagline {
      font-size: 7.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px;
    }
    .store-detail {
      font-size: 9px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── Meta row ──────────────────────────────────────────────── */
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 9px;
    }
    .meta-receipt-num {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-weight: 500;
    }
    .meta-datetime { color: var(--muted); text-align: right; line-height: 1.5; }
    .sub-meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      margin: 1.5px 0;
    }
    .sub-meta-row .sml { color: var(--muted); }
    .sub-meta-row .smv { font-weight: 500; }

    /* ── Items table ───────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: 7.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 500;
      padding: 3px 0 4px;
      border-bottom: 1px dashed var(--line);
    }
    td {
      padding: 4px 0;
      font-size: 10px;
      vertical-align: top;
      border-bottom: 1px dashed var(--line);
    }
    tbody tr:last-child td { border-bottom: none; }
    .td-qty   { text-align: center; color: var(--muted); width: 28px; }
    .td-price { text-align: right; font-family: 'DM Mono', 'Courier New', monospace; white-space: nowrap; }
    .item-sub  { font-size: 8px; color: var(--muted); margin-top: 1px; }
    .item-unit { font-size: 8px; color: var(--muted); font-family: 'DM Mono', monospace; }

    /* ── Totals ────────────────────────────────────────────────── */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 2.5px 0;
    }
    .total-row .tl { font-size: 10px; color: var(--muted); }
    .total-row .ta { font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; }
    .grand-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .grand-total-row .gtl {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .grand-total-row .gta {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
    }

    /* ── Payment badge ─────────────────────────────────────────── */
    .payment-badge {
      display: inline-block;
      background: var(--ink);
      color: var(--bg);
      font-size: 7.5px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 2px;
      margin-bottom: 5px;
    }

    /* ── Barcode ───────────────────────────────────────────────── */
    .barcode-section { text-align: center; padding: 4px 0; }
    .barcode-img { width: 100%; max-width: 220px; height: auto; image-rendering: pixelated; }
    .barcode-caption {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 8px;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-top: 3px;
    }

    /* ── Footer ────────────────────────────────────────────────── */
    .footer-section { text-align: center; padding: 8px 0 4px; }
    .footer-stars { font-size: 13px; letter-spacing: 4px; color: var(--ink); line-height: 1; }
    .footer-thankyou {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 18px;
      margin-top: 5px;
      line-height: 1.2;
    }
    .footer-policy  { font-size: 8px; color: var(--muted); margin-top: 4px; }
    .footer-website { font-size: 7.5px; color: var(--muted); letter-spacing: 0.06em; margin-top: 2px; }

    /* ── 58mm compact adjustments ──────────────────────────────── */
    .receipt.compact-58 { font-size: 10px; }
    .receipt.compact-58 .store-name { font-size: 16px; }
    .receipt.compact-58 .grand-total-row .gtl,
    .receipt.compact-58 .grand-total-row .gta { font-size: 11px; }

    /* ── Print button ──────────────────────────────────────────── */
    .print-btn {
      display: block;
      margin: 10px auto 0;
      border: 0;
      border-radius: 3px;
      padding: 7px 18px;
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    /* ── Print media ───────────────────────────────────────────── */
    @media print {
      body { background: var(--bg); }
      .wrap { width: {{ paper_width or '80mm' }}; margin: 0; }
      .no-print { display: none !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .store-name { font-size: 18px !important; }
      .grand-total-row .gtl,
      .grand-total-row .gta { font-size: 12px !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    {% include '_receipt_content.html' %}
    <button class="print-btn no-print" onclick="window.print()">Print Receipt</button>
  </div>

  <script>
    window.addEventListener('load', () => {
      if ({% if auto_print %}true{% else %}false{% endif %}) {
        window.setTimeout(() => {
          try { window.focus(); } catch (_) {}
          window.print();
        }, 180);
      }
    });

    window.addEventListener('afterprint', () => {
      if ({% if auto_print %}true{% else %}false{% endif %}) {
        try { window.close(); } catch (_) {}
      }
    });
  </script>
</body>
</html>
