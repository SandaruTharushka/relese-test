<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner Settings — Garage Management System</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    :root {
      --card-bg: #fff;
      --border: #e5e7eb;
      --accent: #4f6cf6;
      --accent-hover: #3b56e0;
      --danger: #dc2626;
      --success: #16a34a;
      --warn: #d97706;
      --text: #111827;
      --muted: #6b7280;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; color: var(--text); margin: 0; padding: 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
    .card h2 { font-size: 1rem; font-weight: 600; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
    .card h2 .icon { font-size: 1.1rem; }
    label { font-size: .85rem; font-weight: 500; display: block; margin-bottom: 4px; color: var(--muted); }
    select, input[type=text], input[type=number] {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
      font-size: .9rem; background: #fff; box-sizing: border-box; margin-bottom: 14px;
    }
    select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border: none;
           border-radius: 7px; font-size: .875rem; font-weight: 600; cursor: pointer; transition: .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #f3f4f6; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
                   border-radius: 99px; font-size: .78rem; font-weight: 600; }
    .pill-green { background: #dcfce7; color: #166534; }
    .pill-red { background: #fee2e2; color: #991b1b; }
    .pill-yellow { background: #fef3c7; color: #92400e; }
    .pill-gray { background: #f3f4f6; color: #374151; }
    #bridge-status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    #log { background: #111827; color: #d1fae5; font-family: 'Consolas', monospace; font-size: .8rem;
           padding: 12px; border-radius: 8px; min-height: 80px; max-height: 200px; overflow-y: auto;
           white-space: pre-wrap; margin-top: 12px; }
    .sep { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .test-result { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-size: .875rem; display: none; }
    .test-result.ok { background: #dcfce7; color: #166534; display: block; }
    .test-result.err { background: #fee2e2; color: #991b1b; display: block; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px;
                 color: var(--accent); text-decoration: none; font-size: .875rem; font-weight: 500; }
    .back-link:hover { text-decoration: underline; }
    .device-row { display: flex; gap: 8px; align-items: center; }
    .device-row select { flex: 1; margin-bottom: 0; }
  </style>
</head>
<body>
  <a class="back-link" href="/">&#8592; Back to Dashboard</a>
  <h1>&#128268; Scanner Settings</h1>
  <p class="subtitle">Configure and test your wireless barcode scanners.</p>

  <div class="grid">

    <!-- Bridge Status -->
    <div class="card">
      <h2><span class="icon">&#9881;</span> Bridge Status</h2>
      <div id="bridge-status-row">
        <span class="status-pill pill-gray" id="bridge-pill">&#8226; Checking…</span>
        <button class="btn btn-secondary" onclick="refreshStatus()">&#8635; Refresh</button>
      </div>
      <div id="status-details" style="font-size:.85rem;color:var(--muted);line-height:1.7;"></div>
    </div>

    <!-- Device Assignment -->
    <div class="card">
      <h2><span class="icon">&#128272;</span> Device Assignment</h2>

      <label>Workshop Scanner (stock deduction)</label>
      <div class="device-row">
        <select id="workshop-device">
          <option value="">— Not assigned —</option>
        </select>
        <button class="btn btn-secondary" onclick="detectDevices()" title="Detect HID devices">&#128269;</button>
      </div>

      <label style="margin-top:12px;">Sales Scanner (billing page — keyboard passthrough)</label>
      <div class="device-row">
        <select id="sales-device">
          <option value="">— Not assigned —</option>
        </select>
      </div>

      <hr class="sep" />

      <label>API Base URL</label>
      <input type="text" id="api-url" value="http://127.0.0.1:5000" />

      <label>Debounce (ms)</label>
      <input type="number" id="debounce-ms" value="300" min="50" max="2000" />

      <div class="actions">
        <button class="btn btn-primary" onclick="saveConfig()">&#128190; Save Configuration</button>
        <button class="btn btn-secondary" onclick="detectDevices()">&#128269; Detect Devices</button>
      </div>
      <div id="save-msg" class="test-result"></div>
    </div>

    <!-- Test Scanner -->
    <div class="card">
      <h2><span class="icon">&#128203;</span> Test Scan</h2>
      <p style="font-size:.875rem;color:var(--muted);margin-bottom:14px;">
        Send a test barcode to verify connectivity. No stock is deducted.
      </p>
      <label>Test Barcode</label>
      <input type="text" id="test-barcode" value="TEST-0000" />
      <div class="actions">
        <button class="btn btn-success" onclick="testScan()">&#9654; Send Test Scan</button>
      </div>
      <div id="test-result" class="test-result"></div>
    </div>

    <!-- Activity Log -->
    <div class="card">
      <h2><span class="icon">&#128196;</span> Activity Log</h2>
      <div id="log">Waiting for events…</div>
      <div class="actions" style="margin-top:10px;">
        <button class="btn btn-secondary" onclick="clearLog()">&#128465; Clear Log</button>
      </div>
    </div>

  </div>

  <script src="/static/js/scanner_settings.js"></script>
</body>
</html>
