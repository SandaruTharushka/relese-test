    <path d="M350 690L520 620L730 670L940 640L1160 690L1400 650L1620 710" stroke="#A78AFF" stroke-opacity="0.48"/>
    <path d="M270 390L470 345L670 390L860 360L1060 400L1280 365L1520 410" stroke="#6ED6FF" stroke-opacity="0.42"/>
