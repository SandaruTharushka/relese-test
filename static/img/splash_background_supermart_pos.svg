<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="140" y1="120" x2="1760" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="0.5" stop-color="#141A3D"/>
      <stop offset="1" stop-color="#08182A"/>
    </linearGradient>

    <radialGradient id="glowTopLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 180) rotate(25) scale(760 540)">
      <stop stop-color="#3AA9FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3AA9FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottomRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1560 930) rotate(-12) scale(680 520)">
      <stop stop-color="#9B6DFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9B6DFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cloudHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 470) rotate(0) scale(620 250)">
      <stop stop-color="#57D8FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#57D8FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineCyan" x1="270" y1="540" x2="1650" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56ECFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#56ECFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#56ECFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="linePurple" x1="260" y1="650" x2="1660" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A77AFF" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#A77AFF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#A77AFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feBlend mode="screen" in="SourceGraphic" in2="blur"/>
    </filter>

    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2" result="blurNode"/>
      <feMerge>
        <feMergeNode in="blurNode"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="centerSafeAreaMask">
      <rect width="1920" height="1080" fill="white"/>
      <ellipse cx="960" cy="540" rx="420" ry="210" fill="black"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  <rect width="1920" height="1080" fill="url(#glowTopLeft)"/>
  <rect width="1920" height="1080" fill="url(#glowBottomRight)"/>

  <g opacity="0.26" mask="url(#centerSafeAreaMask)">
    <path d="M0 250C210 290 370 340 560 290C750 240 910 180 1120 220C1330 260 1500 350 1920 290" stroke="#49B6FF" stroke-width="1.4"/>
    <path d="M0 320C220 350 430 420 620 360C810 300 930 250 1150 280C1370 310 1580 400 1920 360" stroke="#6F95FF" stroke-width="1.2"/>
