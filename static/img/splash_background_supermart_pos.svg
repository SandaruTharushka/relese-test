    <path d="M240 650C420 590 590 610 760 670C930 730 1080 735 1260 680C1440 625 1610 615 1690 640" stroke="url(#linePurple)" stroke-width="2"/>
    <path d="M250 430C410 380 580 390 760 435C940 480 1110 485 1300 435C1490 385 1630 390 1690 410" stroke="url(#lineCyan)" stroke-width="1.8" opacity="0.78"/>
  </g>

  <rect width="1920" height="1080" fill="url(#cloudHalo)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 510C590 430 690 390 770 420C815 355 920 332 1005 368C1065 332 1142 340 1195 387C1282 384 1355 446 1368 532C1450 548 1490 603 1483 674H520C516 604 543 548 602 520" stroke="#84D9FF" stroke-opacity="0.5" stroke-width="2.2" filter="url(#softGlow)"/>
    <path d="M605 540C635 480 705 452 772 466C818 418 903 407 969 438C1029 410 1105 421 1155 465C1233 466 1287 519 1299 584C1352 595 1384 637 1380 680H575C572 626 589 581 630 555" stroke="#8C88FF" stroke-opacity="0.45" stroke-width="1.7" filter="url(#softGlow)"/>
