    <circle cx="1400" cy="650" r="3" fill="#B18CFF"/>
    <circle cx="1620" cy="710" r="2.8" fill="#A78AFF"/>

    <circle cx="470" cy="345" r="2.6" fill="#5FD2FF"/>
